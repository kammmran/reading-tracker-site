{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Literature Timeline - Ancient to Modern{% endblock %}</title>
    <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet">
    <script src="{% static 'js/marked.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/book-relation-styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/markdown-styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth-styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    {% block extra_js %}
    <script src="{% static 'js/authors-config.js' %}"></script>
    <script src="{% static 'js/author-manager.js' %}"></script>
    <script src="{% static 'js/notes-panel.js' %}"></script>
    <script src="{% static 'js/reading-list-panel.js' %}"></script>
    <script src="{% static 'js/profile-panel.js' %}"></script>
    <script src="{% static 'js/app_vis.js' %}"></script>
    {% endblock %}
</body>
</html>
